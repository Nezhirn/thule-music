name: thule-music

# Settings come from .env next to this file: copy .env.example and fill it in.
# Start: `docker compose up -d --build`; with the bundled Postgres instead of your own:
# `docker compose --profile local-db up -d --build`. Then open http://<host>:8000.

x-thule: &thule
  build: .
  image: thule-music
  env_file: .env
  environment:
    # Where the folders below are inside the container.
    THULE_LIBRARY_PATH: /library
    THULE_DATA_PATH: /data
  volumes:
    - ${MUSIC_LIBRARY:-./library}:/library
    - ${SERVER_DATA:-./data}:/data
  depends_on:
    postgres:
      condition: service_healthy
      required: false
  restart: unless-stopped
  # Health: the image's HEALTHCHECK (the server's /health, the worker reaching the database).
  # Logs kept to 3 files of 10 MB each, per container.
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  server:
    <<: *thule
    command: ["thule", "serve"]
    ports:
      - "${HTTP_PORT:-8000}:8000"

  worker:
    <<: *thule
    command: ["thule", "worker"]
    # Stopping, the worker gives a running job 20 seconds to finish, then puts it back in
    # the queue: Docker waits this long before it kills it.
    stop_grace_period: 30s

  postgres:
    profiles: ["local-db"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: thule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: thule
    volumes:
      - ${POSTGRES_DATA:-./postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "thule", "-d", "thule"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    restart: unless-stopped
